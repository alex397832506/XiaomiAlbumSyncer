# 威联通套件配置模板，由 .github/scripts/nas/build-qnap.sh 渲染 @VERSION@。
#
# 字段约束来自 QNAP QDK 文档：
#   QPKG_NAME  不超过 20 字符，不能含空格
#   QPKG_VER   不超过 10 字符，不能含空格（构建脚本会自动裁剪）
#   QPKG_RC_NUM 启动顺序号，仅建议值，QTS 重启后会按安装顺序重新分配
QPKG_NAME="xiaomi-album-syncer"
QPKG_VER="@VERSION@"
QPKG_AUTHOR="Coooolfan"
QPKG_LICENSE="GPL-3.0"
QPKG_SUMMARY="把小米云服务中的相册与录音同步到本地 QNAP NAS"
QPKG_DISPLAY_NAME="Xiaomi Album Syncer"
QPKG_SERVICE_PROGRAM="xiaomi-album-syncer.sh"
QPKG_SERVICE_PORT="8080"
QPKG_WEBUI="/"
QPKG_RC_NUM="101"
